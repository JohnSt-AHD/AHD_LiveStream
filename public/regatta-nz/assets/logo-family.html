<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Regatta NZ logo — brand family</title>
<style>
  body {
    margin: 0; min-height: 100dvh; font-family: Outfit, system-ui, sans-serif;
    background: #071018; color: #f5faf8; padding: 28px 18px 48px;
  }
  h1 { font-family: "Barlow Condensed", sans-serif; font-weight: 700; font-size: 26px; margin: 0 0 6px; }
  p.lead { margin: 0 0 22px; opacity: 0.7; font-size: 14px; max-width: 640px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.08em; opacity: 0.55; margin: 28px 0 12px; }
  .row { display: flex; flex-wrap: wrap; gap: 16px; align-items: stretch; }
  .grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); max-width: 980px; }
  figure {
    margin: 0; background: #0d1a28; border: 1px solid rgba(255,255,255,0.1);
    border-radius: 18px; padding: 16px; text-align: center;
  }
  img.big { width: 148px; height: 148px; object-fit: contain; display: block; margin: 0 auto 12px; border-radius: 28px; background: #0a1628; }
  img.ref { width: 140px; height: auto; max-height: 140px; object-fit: contain; display: block; margin: 0 auto 8px; }
  img.full { width: min(260px, 100%); height: auto; display: block; margin: 0 auto 8px; }
  figcaption { font-size: 14px; font-weight: 600; }
  .note { font-size: 12px; opacity: 0.65; line-height: 1.35; margin: 6px 0 0; }
</style>
</head>
<body>
  <h1>Regatta NZ — fit with Altitude HD + CrewSight</h1>
  <p class="lead">Shared language: circular mark, dark field, cyan ring (CrewSight), gold accent for racing. Interiors stay distinct so the three marks sit as siblings.</p>

  <h2>Existing brands</h2>
  <div class="row">
    <figure style="min-width:180px">
      <img class="ref" src="ahd-logo-ref.png" alt="Altitude HD" />
      <figcaption>Altitude HD</figcaption>
      <p class="note">Circle · mountains · drone · monochrome</p>
    </figure>
    <figure style="min-width:160px">
      <img class="ref" src="crewsight-icon-ref.png" alt="CrewSight icon" />
      <figcaption>CrewSight icon</figcaption>
      <p class="note">Cyan ring · crossed oars · yellow pin</p>
    </figure>
    <figure style="min-width:220px">
      <img class="full" src="crewsight-full-ref.png" alt="CrewSight wordmark" />
      <figcaption>CrewSight wordmark</figcaption>
    </figure>
  </div>

  <h2>Regatta NZ options</h2>
  <div class="grid">
    <figure>
      <img class="big" src="mark-family-lanes.png" alt="Lanes family mark" />
      <figcaption>A · Lanes + finish</figcaption>
      <p class="note">Live-tracker DNA. Same cyan ring as CrewSight; gold finish instead of pin.</p>
    </figure>
    <figure>
      <img class="big" src="mark-family-shell.png" alt="Shell family mark" />
      <figcaption>B · Shell + finish dash</figcaption>
      <p class="note">Racing shell in the CrewSight badge — clean at 42px.</p>
    </figure>
    <figure>
      <img class="big" src="mark-family-bridge.png" alt="Bridge family mark" />
      <figcaption>C · Shell + hills</figcaption>
      <p class="note">Closest bridge to Altitude HD’s landscape circle + CrewSight water/ring.</p>
    </figure>
  </div>
</body>
</html>
