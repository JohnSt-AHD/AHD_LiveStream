<!DOCTYPE html>
<html lang="en" class="vg-preview">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, height=1080, initial-scale=1">
    <title>vMix — RNZ Milford Title Preview</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap">
    <link rel="stylesheet" href="vmix-graphics.css?v=77">
    <style>
        /* Avoid a blank white tab before JS/CSS settle */
        html, body {
            margin: 0;
            background: #232e32 !important;
            min-height: 100%;
        }
    </style>
</head>
<body class="vmix-page vg-preview" data-vmix-theme="rnz-milford">
    <div class="vg-stage">
        <div class="vg-bg" id="vgBg" aria-hidden="true"></div>
        <div class="vg-map-wrap" id="vgMapWrap">
            <iframe class="vg-map-frame" id="vgMapFrame" title="Altitude HD speed overlay"></iframe>
        </div>
        <div class="vg-layer" id="vgLayer"></div>
        <p class="vg-error" id="vgError" hidden></p>
    </div>
    <script>
        (function () {
            const params = new URLSearchParams(location.search);
            let changed = false;
            if (!params.get('g') && !params.get('graphic')) {
                params.set('g', 't');
                changed = true;
            }
            if (!params.get('preview')) {
                params.set('preview', '1');
                changed = true;
            }
            if (!params.get('autoplay') && !params.get('play')) {
                params.set('autoplay', '1');
                changed = true;
            }
            if (!params.get('regatta')) {
                params.set('regatta', 'nzmm2026');
                changed = true;
            }
            if (changed) {
                location.replace(`${location.pathname}?${params.toString()}`);
            }
        })();
    </script>
    <script src="hub-csv.js"></script>
    <script src="regatta-csv-archive.js?v=4"></script>
    <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
    <script src="vmix-layout.js?v=47"></script>
    <script src="vmix-gt-import.js"></script>
    <script src="vmix-graphics.js?v=70"></script>
</body>
</html>
