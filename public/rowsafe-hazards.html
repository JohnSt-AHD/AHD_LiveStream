<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>RowSafe · Hazards</title>
    <link rel="stylesheet" href="rowsafe-map.css">
    <link rel="stylesheet" href="rowsafe-logbook.css">
    <link rel="stylesheet" href="rowsafe-hazards.css">
</head>
<body class="rnz-page rnz-logbook-page rnz-hazards-page">
    <a class="rnz-skip" href="#rnz-main">Skip to content</a>

    <header class="rnz-header">
        <div class="rnz-header-crewsight">
            <img src="assets/crewsight/crewsight-logo-full-color.png" alt="CrewSight" class="rnz-crewsight-logo" width="274" height="70" loading="lazy">
        </div>
        <div class="rnz-header-inner">
            <div class="rnz-header-brand">
                <img src="assets/rnz/rnz-logo-white.png" alt="Rowing New Zealand" class="rnz-logo-header" width="160" height="64" loading="lazy">
                <div class="rnz-header-titles">
                    <div class="rnz-header-title">
                        <h1>Hazards</h1>
                    </div>
                </div>
            </div>
            <nav class="rnz-header-nav" aria-label="RowSafe pages">
                <a class="rnz-header-menu-btn" href="rowsafe-map.html">Live map</a>
                <a class="rnz-header-menu-btn" href="rowsafe-logbook.html">Logbook</a>
                <a class="rnz-header-menu-btn rnz-header-menu-btn--active" href="rowsafe-hazards.html" aria-current="page">Hazards</a>
                <a class="rnz-external" href="https://rowingnz.kiwi/rowsafe/" target="_blank" rel="noopener noreferrer">RowSafe on RowingHub ↗</a>
            </nav>
        </div>
    </header>

    <main id="rnz-main" class="rnz-main rnz-logbook-main">
        <section class="rnz-logbook" aria-labelledby="hazards-heading">
            <div class="rnz-logbook-intro">
                <h2 id="hazards-heading">Hazard register</h2>
                <p>Defined hazard zones (from CrewSight Manager) plus crew enter/exit events by day.</p>
            </div>
            <p id="hazardsStatus" class="rnz-logbook-status" role="status">Loading hazard register…</p>

            <h3 class="rnz-hazards-section-title">Defined hazards</h3>
            <div id="hazardsZones" class="rnz-hazard-zones" hidden></div>

            <h3 class="rnz-hazards-section-title">Entry log</h3>
            <div id="hazardsList" class="rnz-logbook-list" hidden></div>
        </section>
    </main>

    <footer class="rnz-footer">
        <p>RowSafe hazards · CrewSight geofence entries</p>
    </footer>

    <script src="rowsafe-hazards.js" defer></script>
</body>
</html>
