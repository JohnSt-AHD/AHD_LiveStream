<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, height=1080, initial-scale=1">
    <title>vMix — RNZ Milford Results Preview</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap">
    <link rel="stylesheet" href="vmix-graphics.css?v=73">
</head>
<body class="vmix-page" data-vmix-theme="rnz-milford">
    <div class="vg-stage">
        <div class="vg-bg" id="vgBg" aria-hidden="true"></div>
        <div class="vg-map-wrap" id="vgMapWrap">
            <iframe class="vg-map-frame" id="vgMapFrame" title="Altitude HD speed overlay"></iframe>
        </div>
        <div class="vg-layer" id="vgLayer"></div>
        <p class="vg-error" id="vgError" hidden></p>
    </div>
    <script>
        /* Preview page: results autoplay, no layout editor. */
        (function () {
            const params = new URLSearchParams(location.search);
            let changed = false;
            if (!params.get('g') && !params.get('graphic')) {
                params.set('g', 'r');
                changed = true;
            }
            if (!params.get('preview')) {
                params.set('preview', '1');
                changed = true;
            }
            if (!params.get('autoplay') && !params.get('play')) {
                params.set('autoplay', '1');
                changed = true;
            }
            if (!params.get('regatta')) {
                params.set('regatta', 'nzmm2026');
                changed = true;
            }
            if (!params.get('race')) {
                params.set('race', '1');
                changed = true;
            }
            if (changed) {
                location.replace(`${location.pathname}?${params.toString()}`);
            }
        })();
    </script>
    <script src="hub-csv.js"></script>
    <script src="regatta-csv-archive.js?v=4"></script>
    <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
    <script src="vmix-layout.js?v=44"></script>
    <script src="vmix-gt-import.js"></script>
    <script src="vmix-graphics.js?v=65"></script>
    <script>
        /* Prefer archived results for a filled preview when live sheet is empty. */
        window.addEventListener('load', async () => {
            const wait = () =>
                new Promise((resolve) => {
                    const tick = () => {
                        if (window.VmixGraphics?.getState?.() !== 'idle') resolve();
                        else setTimeout(tick, 100);
                    };
                    tick();
                });
            try {
                await wait();
                const code = new URLSearchParams(location.search).get('regatta') || 'nzmm2026';
                const res = await fetch(`data/archives/${code}/latest/results.csv`);
                if (!res.ok) return;
                const text = await res.text();
                window.VmixGraphics.seedResultsCsv?.(text);
            } catch {
                /* ignore */
            }
        });
    </script>
</body>
</html>
