<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Rowsuit restyle — all clubs</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700&family=Space+Grotesk:wght@600;700&display=swap">
    <style>
        :root {
            --sky: #2e7de0;
            --cream: #f5f0e4;
            --carbon: #0d1117;
            --grey-900: #232d3a;
            --grey-500: #8a96a5;
        }
        * { box-sizing: border-box; }
        html, body {
            margin: 0;
            min-height: 100%;
            background: var(--carbon);
            color: var(--cream);
            font-family: Archivo, 'Segoe UI', system-ui, sans-serif;
        }
        .page {
            max-width: 1280px;
            margin: 0 auto;
            padding: 28px 24px 48px;
        }
        h1 {
            font-family: 'Space Grotesk', system-ui, sans-serif;
            font-size: 28px;
            margin: 0 0 8px;
        }
        .sub {
            color: var(--grey-500);
            font-size: 15px;
            line-height: 1.5;
            max-width: 72ch;
            margin: 0 0 18px;
        }
        .bar {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
            margin-bottom: 22px;
            position: sticky;
            top: 0;
            z-index: 2;
            background: color-mix(in srgb, var(--carbon) 92%, transparent);
            padding: 10px 0 12px;
        }
        .bar input {
            flex: 1 1 240px;
            min-width: 180px;
            background: var(--grey-900);
            border: 1px solid #3a4554;
            color: var(--cream);
            border-radius: 8px;
            padding: 10px 12px;
            font: inherit;
        }
        .status {
            color: var(--grey-500);
            font-size: 13px;
            white-space: nowrap;
        }
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(420px, 1fr));
            gap: 14px;
        }
        .item {
            background: var(--grey-900);
            border-radius: 12px;
            padding: 12px 12px 10px;
        }
        .item[hidden] { display: none; }
        .item h2 {
            font-family: 'Space Grotesk', system-ui, sans-serif;
            font-size: 14px;
            font-weight: 600;
            margin: 0 0 10px;
            display: flex;
            justify-content: space-between;
            gap: 8px;
            align-items: baseline;
        }
        .item h2 span {
            color: var(--grey-500);
            font-family: inherit;
            font-size: 11px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }
        .pair {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
        }
        .cell {
            border-radius: 8px;
            min-height: 176px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 8px 6px 6px;
        }
        .cell--orig { background: #fff; }
        .cell--clean, .cell--next { background: #1a222c; }
        .cell img, .cell canvas {
            width: 120px;
            height: 150px;
            object-fit: contain;
            display: block;
        }
        .tag {
            margin-top: 6px;
            font-size: 10px;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--grey-500);
        }
        .cell--orig .tag { color: #667; }
        .miss, .err {
            color: #e5484d;
            font-size: 12px;
            text-align: center;
            padding: 12px;
        }
    </style>
</head>
<body>
    <div class="page">
        <h1>Rowsuit restyle — all clubs</h1>
        <p class="sub">
            Original as supplied, then the same RowIT singlet with the white page and club
            code cut away. The original outline stays; whites in the design are not keyed out.
        </p>
        <div class="bar">
            <input id="filter" type="search" placeholder="Filter by club or code…" autocomplete="off">
            <div class="status" id="status">Loading lookup…</div>
        </div>
        <div class="gallery" id="gallery"></div>
    </div>
    <script>
        const LOGO_CSS_W = 120;
        const LOGO_CSS_H = 150;
        const LOGO_W = LOGO_CSS_W * 4;
        const LOGO_H = LOGO_CSS_H * 4;

        function sourceSize(src) {
            return {
                width: src.naturalWidth || src.width,
                height: src.naturalHeight || src.height,
            };
        }

        function isPaper(r, g, b, a) {
            if (a < 40) return true;
            return r > 250 && g > 250 && b > 250;
        }

        function cropSinglet(src) {
            const { width, height } = sourceSize(src);
            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d', { willReadFrequently: true });
            ctx.drawImage(src, 0, 0);
            const { data } = ctx.getImageData(0, 0, width, height);
            const occ = new Array(height).fill(0);
            for (let y = 0; y < height; y++) {
                for (let x = 0; x < width; x++) {
                    const i = (y * width + x) * 4;
                    if (!isPaper(data[i], data[i + 1], data[i + 2], data[i + 3])) occ[y]++;
                }
            }
            const minRow = Math.max(1, Math.round(width * 0.002));
            const runs = [];
            let y = 0;
            while (y < height) {
                while (y < height && occ[y] < minRow) y++;
                const start = y;
                while (y < height && occ[y] >= minRow) y++;
                if (y > start) runs.push({ start, end: y });
            }
            // White fabric breaks occupancy, so take all ink above the club-code band.
            let yLimit = height;
            const last = runs[runs.length - 1];
            if (runs.length >= 2 && last.start > height * 0.5) yLimit = last.start;
            let minX = width;
            let minY = height;
            let maxX = 0;
            let maxY = 0;
            for (let row = 0; row < yLimit; row++) {
                for (let x = 0; x < width; x++) {
                    const i = (row * width + x) * 4;
                    if (isPaper(data[i], data[i + 1], data[i + 2], data[i + 3])) continue;
                    if (x < minX) minX = x;
                    if (x > maxX) maxX = x;
                    if (row < minY) minY = row;
                    if (row > maxY) maxY = row;
                }
            }
            if (maxX < minX || maxY < minY) throw new Error('No garment');
            const pad = 2;
            minX = Math.max(0, minX - pad);
            minY = Math.max(0, minY - pad);
            maxX = Math.min(width - 1, maxX + pad);
            maxY = Math.min(height - 1, maxY + pad);
            const cw = maxX - minX + 1;
            const ch = maxY - minY + 1;
            const out = document.createElement('canvas');
            out.width = cw;
            out.height = ch;
            out.getContext('2d').drawImage(canvas, minX, minY, cw, ch, 0, 0, cw, ch);
            return out;
        }

        function dilateMask(src, w, h, r) {
            const n = w * h;
            const out = new Uint8Array(src);
            for (let y = 0; y < h; y++) {
                for (let x = 0; x < w; x++) {
                    if (!src[y * w + x]) continue;
                    for (let dy = -r; dy <= r; dy++) {
                        for (let dx = -r; dx <= r; dx++) {
                            const nx = x + dx;
                            const ny = y + dy;
                            if (nx < 0 || ny < 0 || nx >= w || ny >= h) continue;
                            out[ny * w + nx] = 1;
                        }
                    }
                }
            }
            return out;
        }

        function erodeMask(src, w, h, r) {
            const out = new Uint8Array(src);
            for (let y = 0; y < h; y++) {
                for (let x = 0; x < w; x++) {
                    if (!src[y * w + x]) continue;
                    let keep = 1;
                    for (let dy = -r; dy <= r && keep; dy++) {
                        for (let dx = -r; dx <= r; dx++) {
                            const nx = x + dx;
                            const ny = y + dy;
                            if (nx < 0 || ny < 0 || nx >= w || ny >= h || !src[ny * w + nx]) {
                                keep = 0;
                                break;
                            }
                        }
                    }
                    if (!keep) out[y * w + x] = 0;
                }
            }
            return out;
        }

        function punchPaper(src) {
            const w = src.width;
            const h = src.height;
            const n = w * h;
            const ctx = src.getContext('2d', { willReadFrequently: true });
            const img = ctx.getImageData(0, 0, w, h);
            const data = img.data;
            const wall = new Uint8Array(n);
            for (let i = 0; i < n; i++) {
                const p = i * 4;
                if (!isPaper(data[p], data[p + 1], data[p + 2], data[p + 3])) wall[i] = 1;
            }
            // Close 1px outline gaps without sealing the U-neck / armholes.
            const sealed = erodeMask(dilateMask(wall, w, h, 1), w, h, 1);
            const outside = new Uint8Array(n);
            const stack = [];
            const tryPush = (x, y) => {
                if (x < 0 || y < 0 || x >= w || y >= h) return;
                const i = y * w + x;
                if (outside[i] || sealed[i]) return;
                const p = i * 4;
                if (!isPaper(data[p], data[p + 1], data[p + 2], data[p + 3])) return;
                outside[i] = 1;
                stack.push(i);
            };
            for (let x = 0; x < w; x++) {
                tryPush(x, 0);
                tryPush(x, h - 1);
            }
            for (let y = 0; y < h; y++) {
                tryPush(0, y);
                tryPush(w - 1, y);
            }
            while (stack.length) {
                const i = stack.pop();
                const x = i % w;
                const yy = (i / w) | 0;
                tryPush(x - 1, yy);
                tryPush(x + 1, yy);
                tryPush(x, yy - 1);
                tryPush(x, yy + 1);
            }
            for (let i = 0; i < n; i++) {
                if (outside[i]) data[i * 4 + 3] = 0;
            }
            const neighbor = (x, y) => {
                if (x < 0 || y < 0 || x >= w || y >= h) return true;
                return data[(y * w + x) * 4 + 3] < 16;
            };
            for (let y = 0; y < h; y++) {
                for (let x = 0; x < w; x++) {
                    const p = (y * w + x) * 4;
                    if (data[p + 3] < 16) continue;
                    if (!isPaper(data[p], data[p + 1], data[p + 2], data[p + 3])) continue;
                    if (neighbor(x - 1, y) || neighbor(x + 1, y) || neighbor(x, y - 1) || neighbor(x, y + 1)) {
                        data[p + 3] = 0;
                    }
                }
            }
            ctx.putImageData(img, 0, 0);
            return src;
        }

        function trimAlpha(src) {
            const w = src.width;
            const h = src.height;
            const ctx = src.getContext('2d', { willReadFrequently: true });
            const { data } = ctx.getImageData(0, 0, w, h);
            let minX = w;
            let minY = h;
            let maxX = 0;
            let maxY = 0;
            for (let y = 0; y < h; y++) {
                for (let x = 0; x < w; x++) {
                    if (data[(y * w + x) * 4 + 3] < 16) continue;
                    if (x < minX) minX = x;
                    if (x > maxX) maxX = x;
                    if (y < minY) minY = y;
                    if (y > maxY) maxY = y;
                }
            }
            if (maxX < minX) return src;
            const cw = maxX - minX + 1;
            const ch = maxY - minY + 1;
            const out = document.createElement('canvas');
            out.width = cw;
            out.height = ch;
            out.getContext('2d').drawImage(src, minX, minY, cw, ch, 0, 0, cw, ch);
            return out;
        }

        function strokeOriginalOutline(canvas) {
            const w = canvas.width;
            const h = canvas.height;
            const ctx = canvas.getContext('2d', { willReadFrequently: true });
            const img = ctx.getImageData(0, 0, w, h);
            const src = img.data;
            const out = new Uint8ClampedArray(src);
            const opaque = (x, y) => {
                if (x < 0 || y < 0 || x >= w || y >= h) return false;
                return src[(y * w + x) * 4 + 3] >= 40;
            };
            for (let y = 0; y < h; y++) {
                for (let x = 0; x < w; x++) {
                    if (opaque(x, y)) continue;
                    if (
                        opaque(x - 1, y) || opaque(x + 1, y) ||
                        opaque(x, y - 1) || opaque(x, y + 1)
                    ) {
                        const i = (y * w + x) * 4;
                        out[i] = 13;
                        out[i + 1] = 17;
                        out[i + 2] = 23;
                        out[i + 3] = 168;
                    }
                }
            }
            img.data.set(out);
            ctx.putImageData(img, 0, 0);
        }

        function prepLogoCtx(canvas) {
            canvas.style.width = `${LOGO_CSS_W}px`;
            canvas.style.height = `${LOGO_CSS_H}px`;
            const ctx = canvas.getContext('2d');
            ctx.imageSmoothingEnabled = true;
            ctx.imageSmoothingQuality = 'high';
            return ctx;
        }

        function cutOriginal(src) {
            const copy = document.createElement('canvas');
            copy.width = src.width;
            copy.height = src.height;
            copy.getContext('2d').drawImage(src, 0, 0);
            return trimAlpha(punchPaper(copy));
        }

        function drawCutout(src, { stroke = false } = {}) {
            let draw = src;
            if (stroke) {
                const copy = document.createElement('canvas');
                copy.width = src.width;
                copy.height = src.height;
                copy.getContext('2d').drawImage(src, 0, 0);
                strokeOriginalOutline(copy);
                draw = copy;
            }
            const canvas = document.createElement('canvas');
            canvas.width = LOGO_W;
            canvas.height = LOGO_H;
            const ctx = prepLogoCtx(canvas);
            const scale = Math.min(LOGO_W / draw.width, LOGO_H / draw.height);
            const dw = draw.width * scale;
            const dh = draw.height * scale;
            ctx.drawImage(draw, (LOGO_W - dw) / 2, (LOGO_H - dh) / 2, dw, dh);
            return canvas;
        }

        function loadImage(src) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                img.onload = () => resolve(img);
                img.onerror = () => reject(new Error('missing'));
                img.src = src;
            });
        }

        function clubList(lookup, missing) {
            const skip = new Set((missing.missingFile || []).map((m) => m.logo));
            const seen = new Set();
            const clubs = [];
            for (const club of Object.values(lookup.clubs || {})) {
                const logo = String(club.logo || '').trim();
                if (!logo || skip.has(logo) || seen.has(logo)) continue;
                if (!/\.png$/i.test(logo) || logo === 'placeholder-white.svg') continue;
                seen.add(logo);
                clubs.push({
                    id: club.id,
                    name: club.name || club.id,
                    logo,
                    src: `assets/school-logos/${encodeURIComponent(logo)}`,
                });
            }
            clubs.sort((a, b) => a.name.localeCompare(b.name));
            return clubs;
        }

        function makeItem(club) {
            const article = document.createElement('article');
            article.className = 'item';
            article.dataset.q = `${club.name} ${club.id}`.toLowerCase();
            article.innerHTML =
                `<h2>${club.name}<span>${club.id}</span></h2>` +
                `<div class="pair">` +
                `<div class="cell cell--orig"><img alt=""><div class="tag">Original</div></div>` +
                `<div class="cell cell--clean"><div class="tag">Cutout</div></div>` +
                `<div class="cell cell--next"><div class="tag">Cutout + line</div></div>` +
                `</div>`;
            article.querySelector('img').alt = club.name;
            return article;
        }

        const status = document.getElementById('status');
        const gallery = document.getElementById('gallery');
        document.getElementById('filter').addEventListener('input', (ev) => {
            const q = ev.target.value.trim().toLowerCase();
            for (const item of gallery.children) {
                item.hidden = q !== '' && !item.dataset.q.includes(q);
            }
        });

        (async () => {
            const [lookup, missing] = await Promise.all([
                fetch('data/ahd-lookup.json').then((r) => r.json()),
                fetch('data/missing-school-logos.json').then((r) => r.json()).catch(() => ({ missingFile: [] })),
            ]);
            let clubs = clubList(lookup, missing);
            const clubQ = new URLSearchParams(location.search).get('club');
            if (clubQ) {
                const parts = clubQ.split(/[,+]/).map((s) => s.trim().toLowerCase()).filter(Boolean);
                clubs = clubs.filter((c) => parts.some((q) => `${c.name} ${c.id}`.toLowerCase().includes(q)));
            }
            status.textContent = `Cutting 0 / ${clubs.length}`;
            const items = clubs.map((club) => {
                const item = makeItem(club);
                gallery.appendChild(item);
                return item;
            });
            let done = 0;
            let ok = 0;
            let miss = 0;
            let failed = 0;
            const filterVal = () => document.getElementById('filter').value.trim().toLowerCase();
            async function processOne(club, item) {
                const q = filterVal();
                item.hidden = q !== '' && !item.dataset.q.includes(q);
                const origCell = item.querySelector('.cell--orig');
                const cleanCell = item.querySelector('.cell--clean');
                const nextCell = item.querySelector('.cell--next');
                const origImg = origCell.querySelector('img');
                try {
                    const img = await loadImage(club.src);
                    origImg.src = club.src;
                    const cutSrc = cutOriginal(cropSinglet(img));
                    const cut = drawCutout(cutSrc, { stroke: false });
                    cut.setAttribute('aria-label', `${club.name} cutout`);
                    cleanCell.insertBefore(cut, cleanCell.firstChild);
                    const lined = drawCutout(cutSrc, { stroke: true });
                    lined.setAttribute('aria-label', `${club.name} cutout outline`);
                    nextCell.insertBefore(lined, nextCell.firstChild);
                    ok += 1;
                } catch (err) {
                    origImg.remove();
                    const msg = document.createElement('div');
                    msg.className = err.message === 'missing' ? 'miss' : 'err';
                    msg.textContent = err.message === 'missing' ? 'No file' : String(err.message || err);
                    origCell.insertBefore(msg, origCell.firstChild);
                    cleanCell.insertBefore(msg.cloneNode(true), cleanCell.firstChild);
                    nextCell.insertBefore(msg.cloneNode(true), nextCell.firstChild);
                    if (err.message === 'missing') miss += 1;
                    else failed += 1;
                }
                done += 1;
                status.textContent = `Cutting ${done} / ${clubs.length} · ${ok} ok`;
            }
            const workers = 8;
            let next = 0;
            await Promise.all(Array.from({ length: workers }, async () => {
                while (next < clubs.length) {
                    const i = next;
                    next += 1;
                    await processOne(clubs[i], items[i]);
                }
            }));
            status.textContent = `${ok} cut out` +
                (miss ? ` · ${miss} missing` : '') +
                (failed ? ` · ${failed} failed` : '');
        })().catch((err) => {
            status.textContent = String(err);
            status.className = 'status err';
        });
    </script>
</body>
</html>
