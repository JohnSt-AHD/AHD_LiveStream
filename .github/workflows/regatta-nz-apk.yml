# Build a sideloadable Regatta NZ Android APK and publish a stable download link.
name: Regatta NZ APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'apps/regatta-nz-native/**'
      - '.github/workflows/regatta-nz-apk.yml'
      - 'public/regatta-nz/**'

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install native deps
        working-directory: apps/regatta-nz-native
        run: npm ci

      - name: Ensure Android platform
        working-directory: apps/regatta-nz-native
        run: |
          if [ ! -f android/gradlew ]; then npx cap add android; fi

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Capacitor sync
        working-directory: apps/regatta-nz-native
        run: npx cap sync android

      - name: Assemble debug APK
        working-directory: apps/regatta-nz-native/android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon

      - name: Prepare release asset (arm64)
        run: |
          APK_DIR=apps/regatta-nz-native/android/app/build/outputs/apk/debug
          if [ -f "$APK_DIR/app-arm64-v8a-debug.apk" ]; then
            cp "$APK_DIR/app-arm64-v8a-debug.apk" Regatta-NZ.apk
          else
            cp "$APK_DIR/app-debug.apk" Regatta-NZ.apk
          fi
          ls -lh Regatta-NZ.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Regatta-NZ-debug-apk
          path: Regatta-NZ.apk
          retention-days: 90

      - name: Publish GitHub Release (stable download link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-apk-regatta-nz-latest
          target_commitish: ${{ github.sha }}
          name: Regatta NZ — Android APK
          body: |
            Sideload this APK on Android (no Play Store).

            1. Download **Regatta-NZ.apk** below
            2. Open on phone → Install (allow unknown apps if asked)
            3. App loads https://ahd-livestream.vercel.app/regatta-nz/

            Install guide: https://ahd-livestream.vercel.app/regatta-nz/install-native.html
          prerelease: true
          make_latest: false
          files: Regatta-NZ.apk
